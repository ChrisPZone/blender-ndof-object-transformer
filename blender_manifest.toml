schema_version = "1.0.0"

id = "ndof_object_transformer"
version = "1.3.0"
name = "NDOF Object Transformer"
tagline = "Move and rotate objects in the 3D viewport with an NDOF device"
maintainer = "ChrisP"
type = "add-on"

website = "https://github.com/ChrisPZone/blender-ndof-object-transformer"
tags = ["3D View", "Object"]
blender_version_min = "4.5.0"
license = [
  "SPDX:GPL-3.0-or-later",
]
copyright = [
  "2025-2026 ChrisP",
]

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.github/",
  "/.claude/",
  "/tests/",
  "/*.zip",
  "/README.md",
  "/CLAUDE.md",
  "/.gitignore"
]
